<!doctype html>
<meta charset="utf-8">
<title>merchant - ダイレクトポスト型</title>
<link rel="stylesheet" href="/style.css">

<h1>お支払い(ダイレクトポスト型)</h1>
<p class="origin">加盟店ページ localhost:8080</p>

<div class="summary">
  <p>注文ID: <span id="order-label"></span></p>
  <p>商品: テスト商品 / 金額: 1,000円</p>
</div>

<!--フォームは加盟店のものだが、送信先(action)はPSP。PSPは return_url(加盟店)へ戻す-->
<form id="payment-form" method="POST" action="http://127.0.0.1:8081/charge" autocomplete="off">
  <label for="cardnumber">カード番号</label>
  <input type="text" id="cardnumber" name="cardnumber" inputmode="numeric" autocomplete="off" required>

  <label for="exp">有効期限(MM/YY)</label>
  <input type="text" id="exp" name="exp" placeholder="12/30" autocomplete="off" required>

  <label for="cvc">セキュリティコード</label>
  <input type="text" id="cvc" name="cvc" inputmode="numeric" autocomplete="off" required>

  <input type="hidden" id="order" name="order">
  <input type="hidden" id="return_url" name="return_url">

  <button type="submit" id="pay-button">支払う</button>
</form>
<p id="payment-status"></p>

<script>
    const MERCHANT_ORIGIN = 'http://localhost:8080';
    const ORDER_ID = new URLSearchParams(location.search).get('order');

    document.getElementById('order-label').textContent = ORDER_ID;
    document.getElementById('order').value = ORDER_ID;
    document.getElementById('return_url').value = MERCHANT_ORIGIN + '/done';
</script>
